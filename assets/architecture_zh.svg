<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bc8cff"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; fill: #f0f6fc; }
    .heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; fill: #e6edf3; font-size: 13px; }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 400; fill: #8b949e; font-size: 11px; }
    .code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #79c0ff; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; font-size: 10px; fill: #ffffff; }
  </style>

  <!-- Background Canvas -->
  <rect width="940" height="590" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Banner -->
  <rect x="25" y="20" width="890" height="42" rx="8" fill="url(#header-grad)" filter="url(#shadow)"/>
  <text x="45" y="46" class="title" font-size="16" letter-spacing="0.5">mylog 架构全景与高性能数据流图</text>
  <rect x="740" y="30" width="155" height="22" rx="11" fill="#0d1117" fill-opacity="0.6"/>
  <text x="752" y="45" class="badge-text" fill="#58a6ff">C++26 Header-Only</text>

  <!-- ==================== LEFT COLUMN: HOT PATH PIPELINE ==================== -->

  <!-- STEP 1: Calling Modern Macro-Free API / Reflection / Macros -->
  <g filter="url(#shadow)">
    <rect x="25" y="80" width="565" height="66" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.2"/>
    <text x="40" y="100" class="heading">1. 业务日志调用入口（现代无宏 API / C++26 静态反射 / 传统宏）</text>
    <text x="40" y="120" class="code">mylog::info("User: {}", session); // C++26 反射 &amp; [[=mylog::sensitive]] 脱敏</text>
    <text x="40" y="136" class="subtext">trace / debug / info / warn / error / fatal | 兼容传统宏 LOG_INFO 等</text>
    <rect x="460" y="90" width="118" height="20" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="#388bfd" stroke-width="1"/>
    <text x="468" y="104" class="badge-text" fill="#58a6ff">std::source_location</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 307 146 L 307 166" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- STEP 2: Level Filtering Gate -->
  <g filter="url(#shadow)">
    <rect x="25" y="166" width="565" height="74" rx="8" fill="url(#card-grad)" stroke="#238636" stroke-width="1.5"/>
    <rect x="35" y="176" width="245" height="54" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="45" y="196" class="heading" fill="#3fb950">编译期分支裁剪</text>
    <text x="45" y="216" class="code" fill="#7ee787">MYLOG_ACTIVE_LEVEL</text>
    <text x="175" y="216" class="subtext">(if constexpr 消除)</text>

    <!-- Fast Path Pass Badge -->
    <rect x="290" y="183" width="34" height="40" rx="4" fill="#238636" fill-opacity="0.2"/>
    <text x="296" y="207" class="badge-text" fill="#3fb950" font-size="12">通过</text>

    <rect x="335" y="176" width="245" height="54" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="345" y="196" class="heading" fill="#58a6ff">运行期抑制级别过滤</text>
    <text x="345" y="216" class="subtext">宽松原子读取比较：</text>
    <text x="455" y="216" class="heading" fill="#e3b341" font-size="12">~0.2 ns/op</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 307 240 L 307 264" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- STEP 3: Formatting, C++26 Reflection, In-Place Buffer & Security Pipeline -->
  <g filter="url(#shadow)">
    <rect x="25" y="264" width="565" height="96" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.2"/>
    <text x="40" y="285" class="heading">3. 格式化、C++26 反射、零拷贝缓冲与安全加固流水线</text>

    <!-- Pipeline Components (4 boxes) -->
    <rect x="40" y="295" width="128" height="54" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="48" y="313" class="heading" font-size="10">C++26 静态反射</text>
    <text x="48" y="328" class="subtext">&lt;meta&gt; 结构体/枚举展开</text>
    <text x="48" y="342" class="subtext" fill="#e3b341">[[=sensitive]] 脱敏</text>

    <rect x="176" y="295" width="128" height="54" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="184" y="313" class="heading" font-size="10">零拷贝原位格式化</text>
    <text x="184" y="328" class="subtext">直接借出 TLS 落盘缓冲</text>
    <text x="184" y="342" class="subtext" fill="#3fb950">消除中间二次 memcpy</text>

    <rect x="312" y="295" width="128" height="54" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="320" y="313" class="heading" font-size="10">时间与 TID 缓存</text>
    <text x="320" y="328" class="subtext">秒级缓存 + 纳秒/UTC</text>
    <text x="320" y="342" class="subtext">POSIX TID 前缀复用</text>

    <rect x="448" y="295" width="132" height="54" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="456" y="313" class="heading" font-size="10">安全防御与加固</text>
    <text x="456" y="328" class="subtext">SWAR 控制字符转义</text>
    <text x="456" y="342" class="subtext">防重入 + 长度截断上限</text>
  </g>

  <!-- Arrow 3 -> 4 (Splits into 2 branches) -->
  <path d="M 175 360 L 175 382" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 445 360 L 445 382" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- STEP 4: Dual Storage Engines (FileManager) -->
  <g filter="url(#shadow)">
    <rect x="25" y="382" width="565" height="188" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.2"/>
    <text x="40" y="403" class="heading">4. 高吞吐落盘引擎（FileManager 双模式架构）</text>

    <!-- Branch A: Shared Single File -->
    <rect x="40" y="414" width="255" height="144" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.2"/>
    <rect x="50" y="422" width="90" height="18" rx="3" fill="#1f6feb" fill-opacity="0.3"/>
    <text x="56" y="435" class="badge-text" fill="#58a6ff">共享单文件模式</text>
    <text x="50" y="456" class="code" font-size="10">createFileOutputFunction()</text>
    <text x="50" y="473" class="subtext">• 借出 TLS 落盘写缓冲（默认 64 KiB）</text>
    <text x="50" y="489" class="subtext">• 内核 <tspan class="code">O_APPEND</tspan> 原子追尾 write(2)</text>
    <text x="50" y="505" class="subtext">• 热路径：<tspan fill="#3fb950" font-weight="600">用户态完全零锁、零拷贝</tspan></text>
    <text x="50" y="522" class="subtext">• 实测吞吐：<tspan fill="#79c0ff" font-weight="600">117.2 ns/op (8.5M ops/s)</tspan></text>
    <text x="50" y="539" class="code" font-size="9" fill="#8b949e">&lt;ts&gt;_&lt;tid&gt;.log</text>

    <!-- Branch B: Per-Thread Dedicated Files -->
    <rect x="305" y="414" width="275" height="144" rx="6" fill="#0d1117" stroke="#8957e5" stroke-width="1.2"/>
    <rect x="315" y="422" width="95" height="18" rx="3" fill="#8957e5" fill-opacity="0.3"/>
    <text x="321" y="435" class="badge-text" fill="#d2a8ff">每线程独占模式</text>
    <text x="315" y="456" class="code" font-size="10">createPerThreadFileOutputFunction()</text>
    <text x="315" y="473" class="subtext">• 各线程独占 fd 与独立 TLS 写缓冲</text>
    <text x="315" y="489" class="subtext">• 彻底消除跨线程写争用与滚动等待</text>
    <text x="315" y="505" class="subtext">• 保障极致平稳的长尾延迟（p99/p999）</text>
    <text x="315" y="522" class="subtext">• 独立增量滚动与保留清理</text>
    <text x="315" y="539" class="code" font-size="9" fill="#8b949e">&lt;ts&gt;_&lt;tid&gt;.log</text>
  </g>


  <!-- ==================== RIGHT COLUMN: CONTROL & STORAGE ==================== -->

  <!-- Dynamic Config Panel -->
  <g filter="url(#shadow)">
    <rect x="605" y="80" width="310" height="234" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.2"/>
    <text x="620" y="103" class="heading">动态配置与热重载机制</text>

    <!-- Generation Counter Mechanism -->
    <rect x="620" y="112" width="280" height="80" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="630" y="130" class="heading" fill="#58a6ff" font-size="11">ConfigHolder 与 ConfigSnapshot</text>
    <text x="630" y="148" class="subtext">• 原子代次计数器 <tspan class="code">generation_</tspan></text>
    <text x="630" y="164" class="subtext">• 快路径：<tspan fill="#3fb950" font-weight="600">本地快照无锁读取 (refConfig)</tspan></text>
    <text x="630" y="180" class="subtext">• publish 发布时原子递增使各线程快照失效</text>

    <!-- Lua Sandbox -->
    <rect x="620" y="199" width="280" height="104" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
    <text x="630" y="217" class="heading" fill="#d29922" font-size="11">沙箱化 Lua 配置热重载</text>
    <text x="630" y="235" class="code" font-size="10">mylog::reloadConfig("config.lua")</text>
    <text x="630" y="252" class="subtext">• C++26 反射 <tspan class="code">template for</tspan> 自动解析</text>
    <text x="630" y="268" class="subtext">• 枚举字符串反查（"trace" / "none"，拒整型）</text>
    <text x="630" y="284" class="subtext">• 裸 <tspan class="code">lua_State</tspan>，禁用 os/io/package，事务级全量校验</text>
  </g>

  <!-- Connecting line from Config to Pipeline -->
  <path d="M 605 150 L 590 150" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- File Rotation & Retention -->
  <g filter="url(#shadow)">
    <rect x="605" y="325" width="310" height="245" rx="8" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.2"/>
    <text x="620" y="348" class="heading">日志滚动与保留清理策略</text>

    <!-- Capacity-Based Rolling -->
    <rect x="620" y="358" width="280" height="88" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="630" y="376" class="heading" fill="#3fb950" font-size="11">按容量自动滚动换文件</text>
    <text x="630" y="394" class="subtext">• 单文件达到 <tspan class="code">fileCapacity</tspan> 自动触发换文件</text>
    <text x="630" y="410" class="subtext">• 代次计数 <tspan class="code">gen_</tspan> + 写者计数 <tspan class="code">writers_</tspan> 闸门</text>
    <text x="630" y="426" class="subtext">• 消除并发写入下的 fd 复用与文件覆盖竞态</text>

    <!-- Incremental Retention Purge -->
    <rect x="620" y="454" width="280" height="106" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="630" y="472" class="heading" fill="#f0883e" font-size="11">O(1) 增量维护历史保留策略</text>
    <text x="630" y="490" class="subtext">• 最多保留 <tspan class="code">maxFiles</tspan> 个最新日志文件</text>
    <text x="630" y="506" class="subtext">• 初始基线扫描 + 滚动时 <tspan fill="#3fb950" font-weight="600">O(1)</tspan> 二分插入与淘汰</text>
    <text x="630" y="522" class="subtext">• 避免大目录每次滚动全量遍历引发 I/O 阻塞</text>
    <text x="630" y="538" class="subtext">• 严格按目标特征后缀与格式校验，不误删外部文件</text>
  </g>

  <!-- Connective flow between FileManager and Rolling -->
  <path d="M 590 480 L 605 480" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="3 3"/>

</svg>
